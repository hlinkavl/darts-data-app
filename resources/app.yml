resources:
  apps:
    darts_app:
      name: darts-performance-analyzer
      description: PDC darts tournament predictions and player Performance Index.
      source_code_path: ../app
      # Exposed to the app as DATABRICKS_WAREHOUSE_ID (app.yaml: valueFrom: sql-warehouse).
      resources:
        - name: sql-warehouse
          description: SQL warehouse for the gold tables
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: github-token
          description: GitHub token for the Refresh button (Actions read and write on this repository)
          secret:
            scope: darts
            key: github_token
            permission: READ
        # Exposed as GENIE_SPACE_ID (Ask the data). Created by scripts/genie_space.py from config/genie/space.yml.
        - name: genie-space
          description: Genie space behind the Ask the data page
          genie_space:
            name: Darts Performance Analyzer
            space_id: 01f1ddf6938b1cb19ccfe38d51512b61
            permission: CAN_RUN
