resources:
  jobs:
    darts_refresh:
      name: darts_refresh
      description: Monthly (and on-demand) refresh of darts data, Performance Index and predictions.
      # 1st of every month at 06:00 Prague time. Development mode keeps schedules paused.
      schedule:
        quartz_cron_expression: "0 0 6 1 * ?"
        timezone_id: Europe/Prague
        pause_status: PAUSED
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      parameters:
        - name: catalog
          default: ${var.catalog}
      # Serverless compute: notebook tasks need no cluster definition.
      # Raw files are uploaded to the Volume by `python -m ingestion.run --upload` (Darts Orakel blocks
      # Databricks IPs; since 30 Oct 2026 Mastercaller + Wikipedia, see docs/PLAN.md). AI tasks follow on Day 3.
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../src/notebooks/01_bronze.py
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../src/notebooks/02_silver.py
        - task_key: quality
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../src/notebooks/03_quality.py
        - task_key: pi_model
          depends_on:
            - task_key: quality
          notebook_task:
            notebook_path: ../src/notebooks/04_pi_model.py
        - task_key: performance_index
          depends_on:
            - task_key: pi_model
          notebook_task:
            notebook_path: ../src/notebooks/05_performance_index.py
        - task_key: tournaments
          depends_on:
            - task_key: performance_index
          notebook_task:
            notebook_path: ../src/notebooks/06_tournaments.py
        # Last step: a red health report fails the job, which sends the failure e-mail.
        - task_key: health
          depends_on:
            - task_key: tournaments
          notebook_task:
            notebook_path: ../src/notebooks/07_health.py

    darts_egress_check:
      name: darts_egress_check
      description: Checks which data sources are reachable from serverless compute.
      tasks:
        - task_key: egress_check
          notebook_task:
            notebook_path: ../src/notebooks/00_egress_check.py
