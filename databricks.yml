# Databricks Asset Bundle: versions the refresh Job and the Streamlit App.
bundle:
  name: darts-data-app

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog (Free Edition default is "workspace")
    default: workspace
  warehouse_id:
    description: SQL warehouse the app reads the gold tables from (Free Edition has one)
    lookup:
      warehouse: Serverless Starter Warehouse

targets:
  dev:
    mode: development
    default: true
    workspace:
      profile: darts
