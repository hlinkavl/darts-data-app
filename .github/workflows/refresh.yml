# Refresh: ingest new data (Mastercaller, Wikipedia) into the Databricks Volume, then run the darts_refresh job.
# Scheduled daily, but only does work while a major is running (or starts tomorrow); otherwise run it by hand
# ("Run workflow") or from the app's Refresh button. Secrets: DATABRICKS_HOST, DATABRICKS_TOKEN.
name: refresh

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ingest.txt

      - run: pip install -r requirements-ingest.txt

      - name: Is a major running?
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            python scripts/should_refresh.py
          fi

      - name: Ingest (Mastercaller, Wikipedia) and upload to the Volume
        if: steps.gate.outputs.run == 'true'
        run: python -m ingestion.run --upload

      - name: Run the darts_refresh job (bronze → silver → model → tournaments → health)
        if: steps.gate.outputs.run == 'true'
        run: python scripts/run_refresh_job.py
