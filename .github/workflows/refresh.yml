# Refresh: ingest new data (Mastercaller, Wikipedia) into the Databricks Volume, then run the darts_refresh job.
# Scheduled daily, but only does work while a major is running (or starts tomorrow); otherwise run it by hand
# ("Run workflow") or from the app's Refresh button. Secrets: DATABRICKS_HOST, DATABRICKS_TOKEN.
# The "is a major running?" check reads the majors' Wikipedia pages, so it uses no Databricks compute.
name: refresh

on:
  schedule:
    - cron: "23 3 * * *"  # off the full hour: GitHub delays top-of-hour schedules by hours
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ingest.txt

      - run: pip install -r requirements-ingest.txt

      - name: Is a major running?
        id: gate
        run: |
          if [ -z "$DATABRICKS_HOST" ] || [ -z "$DATABRICKS_TOKEN" ]; then
            echo "::notice::DATABRICKS_HOST / DATABRICKS_TOKEN secrets are not set yet, skipping the refresh"
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            python scripts/should_refresh.py
          fi

      - name: Ingest (Mastercaller, Wikipedia) and upload to the Volume
        id: ingest
        if: steps.gate.outputs.run == 'true'
        # A failing source must not stop the rest: what the other sources returned is uploaded, the job still runs
        # (its health report turns red and names the source) and the app still starts. The run fails at the end.
        continue-on-error: true
        run: python -m ingestion.run --upload

      - name: Run the darts_refresh job (bronze → silver → model → tournaments → health)
        if: steps.gate.outputs.run == 'true'
        # Scheduled runs only happen during a major: then the app is started too (it stays stopped otherwise).
        run: python scripts/run_refresh_job.py ${{ github.event_name == 'schedule' && '--start-app' || '' }}

      - name: Fail the run if ingestion had errors (GitHub e-mails on failure)
        if: steps.gate.outputs.run == 'true' && steps.ingest.outcome == 'failure'
        run: |
          echo "::error::ingestion finished with errors (see the Ingest step and the health report)"
          exit 1
