# Checks whether data sources accept requests from GitHub-hosted runners (see docs/PLAN.md, step 3.4).
# One job per source, so each result is visible as a job conclusion.
name: egress-check

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/egress-check.yml

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.source }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: mastercaller-matchcenter
            url: https://mastercaller.com/matchcenter/2026/10/25
          - source: mastercaller-results
            url: https://mastercaller.com/tournaments/players-championships/2026-pc-31-den-bosch/results
          - source: pdc-news-rss
            url: https://www.pdc.tv/rss.xml
          - source: wikipedia
            url: https://en.wikipedia.org/w/api.php?action=query&meta=siteinfo&format=json
          - source: wikidata
            url: https://www.wikidata.org/w/api.php?action=wbsearchentities&search=Luke%20Littler&language=en&format=json
    steps:
      - name: Request ${{ matrix.source }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -A "darts-data-app/0.1 (+https://github.com/hlinkavl/darts-data-app; non-commercial)" \
            "${{ matrix.url }}")
          echo "HTTP $code"
          test "$code" = "200"
