# PDC majors: the televised events used for the tournament overviews (and tested as "Big-Stage Delta").
# Keyed by Darts Orakel tournament_key, because Orakel's event categories change between years
# (e.g. Masters is "U" in some years and "MJ" in others, the World Cup shares "WC").
# wiki: English Wikipedia title per edition; {year} is the year the event ends (WC 2026/27 -> 2027).
# mastercaller: series slug on mastercaller.com (results source since 30 Oct 2026).
majors:
  1:
    name: World Championship
    wiki: "{year} PDC World Darts Championship"
    mastercaller: pdc-world-championship
  1068:
    name: Masters
    wiki: "{year} Masters (darts)"
    mastercaller: the-masters
  9:
    name: UK Open
    wiki: "{year} UK Open"
    mastercaller: uk-open
  1070:
    name: Premier League
    wiki: "{year} Premier League Darts"
    mastercaller: premier-league
  29:
    name: World Matchplay
    wiki: "{year} World Matchplay"
    mastercaller: world-matchplay
  1072:
    name: World Series of Darts Finals
    wiki: "{year} World Series of Darts Finals"
    mastercaller: world-series-of-darts-finals
  36:
    name: World Grand Prix
    wiki: "{year} World Grand Prix (darts)"
    mastercaller: world-grand-prix
  40:
    name: European Championship
    wiki: "{year} European Championship (darts)"
    mastercaller: european-championship
  41:
    name: Grand Slam
    wiki: "{year} Grand Slam of Darts"
    mastercaller: grand-slam-of-darts
  42:
    name: Players Championship Finals
    wiki: "{year} Players Championship Finals"
    mastercaller: players-championship-finals
